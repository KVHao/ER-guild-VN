<script>
(async function(){
  'use strict';
  const LINKED_MAIN="https://raw.githubusercontent.com/KVHao/ER-guild-VN/24fb29af6893db632cd4f36531a59200d4fadd3d/index.html";
  const FIX_CODE=";(function(){\n  'use strict';\n  if(window.__ER_COMPANION_V155B_FIX__)return;\n  window.__ER_COMPANION_V155B_FIX__=true;\n  const PAYLOAD_KEY='kvhao_er_damage_payload_v1';\n  const DAMAGE_PAGE='./damage-calculator.html?v=1.5.5b';\n  const WEAPON_SLOTS=['weaponR1','weaponL1','weaponR2','weaponL2','weaponR3','weaponL3'];\n  const WEAPON_FIELDS=WEAPON_SLOTS.flatMap(slot=>[slot,slot+'Upgrade',slot+'Affinity',slot+'Ash']);\n  const ARMOR_FIELDS=['helm','chestArmor','gauntlets','legs','greatRune'];\n  const UTILITY_FIELDS=['talisman1','talisman2','talisman3','talisman4','talismanAlt1','talismanAlt2','talismanAlt3','talismanAlt4','physick1','physick2','physick3','physick4'];\n  const FREE_FIELDS=[...Array.from({length:12},(_,i)=>'spell'+(i+1)),...Array.from({length:4},(_,i)=>'spirit'+(i+1)),...Array.from({length:6},(_,i)=>'quickItem'+(i+1)),'weaponLoadoutNote','utilityLoadoutNote','buildNotes'];\n\n  const cloneValue=value=>{try{return JSON.parse(JSON.stringify(value))}catch(e){return null}};\n  const clampIndex=value=>Math.max(1,Math.min(3,Number(value)||1));\n  const byId=id=>document.getElementById(id);\n  const unique=list=>[...new Set((list||[]).filter(Boolean).map(String))];\n\n  function iconCandidates(fieldId){\n    const out=[];\n    const holder=document.querySelector(`[data-planner-icon-field=\"${fieldId}\"]`);\n    const img=holder?.querySelector?.('img');\n    if(img?.src)out.push(img.src);\n    try{const list=JSON.parse(decodeURIComponent(img?.dataset?.iconCandidates||''));if(Array.isArray(list))out.push(...list)}catch(e){}\n    try{\n      if(typeof plannerCurrentItem==='function'&&typeof plannerItemIconDescriptor==='function'){\n        const item=plannerCurrentItem(fieldId),desc=item?plannerItemIconDescriptor(fieldId,item):null;\n        if(desc?.candidates)out.push(...desc.candidates);\n        if(desc?.url)out.push(desc.url);\n      }\n    }catch(e){}\n    return unique(out);\n  }\n\n\n  const MAJOR_BOSS_SPECS=[\n    {id:'godrick',name:'Godrick the Grafted',part:'Game chính'},\n    {id:'rennala',name:'Rennala, Queen of the Full Moon',part:'Game chính'},\n    {id:'radahn',name:'Starscourge Radahn',part:'Game chính'},\n    {id:'morgott',name:'Morgott, the Omen King',part:'Game chính'},\n    {id:'fire-giant',name:'Fire Giant',part:'Game chính'},\n    {id:'maliketh',name:'Maliketh, the Black Blade',aliases:['Beast Clergyman'],part:'Game chính'},\n    {id:'godfrey',name:'Godfrey, First Elden Lord',aliases:['Hoarah Loux, Warrior'],part:'Game chính'},\n    {id:'radagon',name:'Radagon of the Golden Order',part:'Game chính'},\n    {id:'elden-beast',name:'Elden Beast',part:'Game chính'},\n    {id:'mohg',name:'Mohg, Lord of Blood',part:'Game chính'},\n    {id:'malenia',name:'Malenia, Blade of Miquella',aliases:['Malenia, Goddess of Rot'],part:'Game chính'},\n    {id:'placidusax',name:'Dragonlord Placidusax',part:'Game chính'},\n    {id:'dancing-lion',name:'Divine Beast Dancing Lion',part:'Shadow of the Erdtree'},\n    {id:'rellana',name:'Rellana, Twin Moon Knight',part:'Shadow of the Erdtree'},\n    {id:'messmer',name:'Messmer the Impaler',aliases:['Base Serpent Messmer'],part:'Shadow of the Erdtree'},\n    {id:'metyr',name:'Metyr, Mother of Fingers',part:'Shadow of the Erdtree'},\n    {id:'romina',name:'Romina, Saint of the Bud',part:'Shadow of the Erdtree'},\n    {id:'putrescent-knight',name:'Putrescent Knight',part:'Shadow of the Erdtree'},\n    {id:'midra',name:'Midra, Lord of Frenzied Flame',part:'Shadow of the Erdtree'},\n    {id:'bayle',name:'Bayle the Dread',part:'Shadow of the Erdtree'},\n    {id:'consort-radahn',name:'Promised Consort Radahn',aliases:['Radahn, Consort of Miquella'],part:'Shadow of the Erdtree'}\n  ];\n\n  const bossNumber=value=>{const n=Number(String(value??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0};\n  const bossNormalize=value=>{try{if(typeof normalizeBossName==='function')return normalizeBossName(value)}catch(e){}return String(value||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[’‘`]/g,\"'\").replace(/[^a-z0-9]+/g,' ').trim()};\n  async function collectMajorBosses(){\n    try{if(typeof initItemChecklist==='function')await initItemChecklist()}catch(e){console.warn('[Boss Bridge] Checklist:',e)}\n    try{if(typeof initBossExtraData==='function')await initBossExtraData()}catch(e){console.warn('[Boss Bridge] Extra data:',e)}\n    let items=[];\n    try{if(typeof allBossItems==='function')items=allBossItems()||[]}catch(e){console.warn('[Boss Bridge] Items:',e)}\n    return MAJOR_BOSS_SPECS.map(spec=>{\n      const wanted=[spec.name,...(spec.aliases||[])].map(bossNormalize);\n      const item=items.find(entry=>wanted.includes(bossNormalize(entry?.name)))||items.find(entry=>wanted.some(key=>{const name=bossNormalize(entry?.name);return name&&((name.includes(key))||(key.includes(name))) }));\n      let info={},image={},locations=[];\n      try{if(item&&typeof bossCombatInfo==='function')info=bossCombatInfo(item)||{}}catch(e){}\n      try{if(item&&typeof bossImageDescriptor==='function')image=bossImageDescriptor(item)||{}}catch(e){}\n      try{if(item&&typeof bossLocations==='function')locations=bossLocations(item)||[]}catch(e){}\n      const weaknesses=unique([...(info.weaknesses||[])]),resistances=unique([...(info.resistances||[])]),candidates=unique([...(image.candidates||[]),image.url||'',info.image||'']);\n      return{id:spec.id,name:item?.name||spec.name,part:spec.part,region:locations[0]||info.api?.region||info.api?.location||'',hp:bossNumber(info.health||info.combat?.health||info.api?.healthPoints),weaknesses,resistances,image:image.url||info.image||'',imageCandidates:candidates};\n    });\n  }\n\n  function damageStatSet(payload,addGodrick=0){\n    const src=payload?.stats||{},mods=payload?.statModifiers||{};\n    const map={str:'strength',dex:'dexterity',int:'intelligence',fai:'faith',arc:'arcane'},out={};\n    Object.entries(map).forEach(([short,long])=>{out[short]=Math.max(1,Math.min(99,Math.floor(Number(src[long]??10)+Number(mods[long]||0)+Number(addGodrick||0))))});\n    return out;\n  }\n  function catalystRoleForWeapon(w){\n    const text=String([w?.catalyst,w?.meta?.group,w?.meta?.category,w?.name].filter(Boolean).join(' ')).toLowerCase();\n    if(text.includes('staff of the great beyond'))return'both';\n    if(/staff|glintstone|pháp trượng/.test(text))return'sorcery';\n    if(/seal|sacred seal|ấn chú/.test(text))return'incantation';\n    return'';\n  }\n  function catalystCorrectionType(variant,row,role){\n    const preferred=role==='sorcery'?[1,4,2,0,3]:[4,2,1,0,3];\n    let best=preferred[0],bestScore=-1;\n    for(const type of preferred){\n      let correct={};try{correct=typeof weaponAttackElementCorrect==='function'?weaponAttackElementCorrect(variant,type):{}}catch(e){}\n      let score=0;\n      for(const attr of ['str','dex','int','fai','arc'])if(correct?.[attr]&&Number(row?.scaling?.[attr]||0))score++;\n      if(score>bestScore){bestScore=score;best=type}\n    }\n    return best;\n  }\n  function calculateCatalystScaling(variant,upgradeLevel,stats,role){\n    try{\n      if(!variant||typeof decodeWeaponUpgradeRows!=='function'||typeof weaponCalcGraphValues!=='function'||typeof weaponCalcGraphId!=='function'||typeof weaponAttackElementCorrect!=='function')return 0;\n      const rows=decodeWeaponUpgradeRows(variant)||[],row=rows[Math.max(0,Math.min(rows.length-1,Number(upgradeLevel)||0))];if(!row)return 0;\n      const type=catalystCorrectionType(variant,row,role),correct=weaponAttackElementCorrect(variant,type)||{};\n      const unmet=['str','dex','int','fai','arc'].filter(attr=>Number(variant.requirements?.[attr]||0)>Number(stats?.[attr]||1));\n      if(unmet.some(attr=>correct?.[attr]))return 60;\n      let total=1;\n      for(const attr of ['str','dex','int','fai','arc']){\n        const correction=correct?.[attr];if(!correction)continue;\n        const upgradedScaling=Number(row.scaling?.[attr]||0);if(!upgradedScaling)continue;\n        let scaling=upgradedScaling;\n        if(correction!==true){\n          const baseScaling=Number((variant.attributeScaling||[]).find(([key])=>key===attr)?.[1]||0);\n          if(baseScaling)scaling=Number(correction)*upgradedScaling/baseScaling;\n        }\n        if(!scaling)continue;\n        const graph=weaponCalcGraphValues(weaponCalcGraphId(variant,type));\n        total+=Number(graph[Math.max(1,Math.min(148,Number(stats?.[attr]||1)))]||0)*scaling;\n      }\n      return Math.max(0,Math.floor(100*total+1e-6));\n    }catch(error){console.warn('[Catalyst Scaling]',variant?.name,error);return 0}\n  }\n  async function enrichCatalystScaling(copy){\n    try{if(typeof ensureWeaponRegulation==='function')await ensureWeaponRegulation()}catch(e){console.warn('[Catalyst Scaling] regulation:',e);return copy}\n    const baseStats=damageStatSet(copy,0),godrickStats=damageStatSet(copy,5);\n    copy.weapons=(copy.weapons||[]).map(w=>{\n      const role=catalystRoleForWeapon(w);if(!role)return w;\n      try{\n        const variants=typeof findWeaponVariants==='function'?(findWeaponVariants(w.name)||[]):[];\n        const desired=String(w.affinity||'Standard').toLowerCase();\n        const variant=variants.find(v=>{try{return String(weaponAffinityName(v)||'').toLowerCase()===desired}catch(e){return false}})||variants[0];\n        if(!variant)return w;\n        const level=Math.max(0,Number(w.upgrade)||0),base=calculateCatalystScaling(variant,level,baseStats,role),godrick=calculateCatalystScaling(variant,level,godrickStats,role);\n        if(base>0){w.catalystType=role;w.spellScaling={base,godrick:godrick||base};if(role==='sorcery'||role==='both')w.sorceryScaling=w.spellScaling;if(role==='incantation'||role==='both')w.incantScaling=w.spellScaling}\n      }catch(error){console.warn('[Catalyst Scaling] weapon:',w?.name,error)}\n      return w;\n    });\n    return copy;\n  }\n\n  async function enrichDamagePayload(payload){\n    const copy=cloneValue(payload)||payload||{};\n    copy.weapons=(copy.weapons||[]).map(weapon=>{\n      const w={...weapon};\n      try{if(typeof plannerCurrentItem==='function'){const item=plannerCurrentItem(String(w.slot||''));if(item)w.meta={...(w.meta||{}),name:item.name||w.name||'',group:item.group||w.meta?.group||'',category:item.category||w.meta?.category||'',id:item.id||w.meta?.id||''}}}catch(e){}\n      const ashField=String(w.slot||'')+'Ash';\n      const images=iconCandidates(ashField);\n      w.ashIcon=images[0]||'';\n      w.ashImageCandidates=images;\n      try{\n        if(typeof plannerCurrentItem==='function'){\n          const item=plannerCurrentItem(ashField);\n          w.ashMeta=item?{name:item.name||'',group:item.group||'',category:item.category||'',id:item.id||'',description:item.description||item.desc||item.effect||item.details||'',charge:item.charge??item.canCharge??item.charged??''}:null;\n        }\n      }catch(e){}\n      return w;\n    });\n    await enrichCatalystScaling(copy);\n    copy.bosses=await collectMajorBosses();\n    return copy;\n  }\n\n  async function openDamageFixed(button){\n    const original=button?.innerHTML||'';\n    try{\n      if(button){button.disabled=true;button.innerHTML='Đang chuẩn bị dữ liệu...'}\n      if(!window.ERDamageBridge?.capture)throw new Error('Damage Bridge chưa sẵn sàng.');\n      const payload=await enrichDamagePayload(await window.ERDamageBridge.capture());\n      localStorage.setItem(PAYLOAD_KEY,JSON.stringify(payload));\n      const target=new URL(DAMAGE_PAGE,location.href);\n      target.searchParams.set('from','planner');target.searchParams.set('t',Date.now());\n      window.open(target.href,'_blank','noopener');\n    }catch(error){\n      console.error('[Damage Bridge Fix]',error);\n      try{if(typeof toast==='function')toast('Không gửi được Build sang Damage Calculator')}catch(e){}\n      alert('Không gửi được Build sang Damage Calculator: '+String(error?.message||error));\n    }finally{if(button){button.disabled=false;button.innerHTML=original}}\n  }\n\n  function bindDamageButton(){\n    const old=byId('plannerDamageLaunchBtn');\n    if(!old)return false;\n    if(old.dataset.v155Bound==='1')return true;\n    const button=old.cloneNode(true);\n    button.dataset.v155Bound='1';\n    old.replaceWith(button);\n    button.addEventListener('click',event=>{event.preventDefault();openDamageFixed(button)});\n    window.ERDamageBridge=window.ERDamageBridge||{};\n    window.ERDamageBridge.open=()=>openDamageFixed(button);\n    return true;\n  }\n\n  function syncPlannerBeforeExport(){\n    try{if(typeof saveActiveWeaponLoadoutFromDom==='function')saveActiveWeaponLoadoutFromDom()}catch(e){console.warn(e)}\n    try{if(typeof saveActiveArmorLoadoutFromDom==='function')saveActiveArmorLoadoutFromDom()}catch(e){console.warn(e)}\n    try{if(typeof saveActiveUtilityLoadoutFromDom==='function')saveActiveUtilityLoadoutFromDom()}catch(e){console.warn(e)}\n    state.planner=state.planner||cloneValue(DEFAULT_STATE.planner)||{};\n    state.planner.fields=state.planner.fields&&typeof state.planner.fields==='object'?state.planner.fields:{};\n    [...WEAPON_FIELDS,...ARMOR_FIELDS,...UTILITY_FIELDS,...FREE_FIELDS].forEach(id=>{\n      const el=byId(id);if(el)state.planner.fields[id]=String(el.value??'');\n    });\n    try{if(typeof ensureWeaponLoadouts==='function')ensureWeaponLoadouts()}catch(e){}\n    try{if(typeof ensureArmorLoadouts==='function')ensureArmorLoadouts()}catch(e){}\n    try{if(typeof ensureUtilityLoadouts==='function')ensureUtilityLoadouts()}catch(e){}\n    return state.planner;\n  }\n\n  function normalizeLoadoutMap(source,fieldIds,defaults={},withNote=false,legacy={}){\n    const map=source&&typeof source==='object'&&!Array.isArray(source)?source:{};\n    const out={};\n    for(let index=1;index<=3;index++){\n      const key=String(index),raw=map[key]||map[index]||(index===1?legacy:{}),entry={};\n      fieldIds.forEach(id=>entry[id]=String(raw?.[id]??defaults[id]??''));\n      if(withNote)entry.note=String(raw?.note??(index===1?legacy.note:'')??'');\n      out[key]=entry;\n    }\n    return out;\n  }\n\n  function normalizeImportedPlanner(raw){\n    if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Không tìm thấy dữ liệu Planner.');\n    let planner=typeof deepMerge==='function'?deepMerge(DEFAULT_STATE.planner,cloneValue(raw)||raw):(cloneValue(raw)||{});\n    const className=String(planner.className||'');\n    if(typeof CLASSES==='undefined'||!CLASSES[className])throw new Error('Lớp khởi đầu trong file không hợp lệ.');\n    const base=CLASSES[className];\n    planner.stats=planner.stats&&typeof planner.stats==='object'?planner.stats:{};\n    Object.keys(STAT_LABELS).forEach(key=>{\n      const n=Number(planner.stats[key]);\n      if(!Number.isFinite(n))throw new Error(`Chỉ số ${STAT_LABELS[key]} không hợp lệ.`);\n      planner.stats[key]=Math.max(Number(base.stats[key])||1,Math.min(99,Math.round(n)));\n    });\n    const used=Object.keys(base.stats).reduce((sum,key)=>sum+Math.max(0,planner.stats[key]-base.stats[key]),0);\n    planner.ownedLevel=Math.min(713,base.level+used);\n    planner.fields=planner.fields&&typeof planner.fields==='object'&&!Array.isArray(planner.fields)?planner.fields:{};\n\n    const weaponDefaults={};WEAPON_FIELDS.forEach(id=>weaponDefaults[id]=id.endsWith('Affinity')?'Standard':id.endsWith('Upgrade')?'0':'');\n    const weaponLegacy={note:String(planner.fields.weaponLoadoutNote||'')};WEAPON_FIELDS.forEach(id=>weaponLegacy[id]=String(planner.fields[id]??weaponDefaults[id]));\n    const armorLegacy={};ARMOR_FIELDS.forEach(id=>armorLegacy[id]=String(planner.fields[id]||''));\n    const utilityLegacy={note:String(planner.fields.utilityLoadoutNote||'')};UTILITY_FIELDS.forEach(id=>utilityLegacy[id]=String(planner.fields[id]||''));\n\n    planner.weaponLoadouts=normalizeLoadoutMap(raw.weaponLoadouts||planner.weaponLoadouts,WEAPON_FIELDS,weaponDefaults,true,weaponLegacy);\n    planner.armorLoadouts=normalizeLoadoutMap(raw.armorLoadouts||planner.armorLoadouts,ARMOR_FIELDS,{},false,armorLegacy);\n    planner.utilityLoadouts=normalizeLoadoutMap(raw.utilityLoadouts||planner.utilityLoadouts,UTILITY_FIELDS,{},true,utilityLegacy);\n    planner.weaponLoadoutActive=clampIndex(raw.weaponLoadoutActive??planner.weaponLoadoutActive);\n    planner.armorLoadoutActive=clampIndex(raw.armorLoadoutActive??planner.armorLoadoutActive);\n    planner.utilityLoadoutActive=clampIndex(raw.utilityLoadoutActive??planner.utilityLoadoutActive);\n\n    const activeWeapon=planner.weaponLoadouts[String(planner.weaponLoadoutActive)];\n    WEAPON_FIELDS.forEach(id=>planner.fields[id]=activeWeapon[id]);planner.fields.weaponLoadoutNote=activeWeapon.note||'';\n    const activeArmor=planner.armorLoadouts[String(planner.armorLoadoutActive)];\n    ARMOR_FIELDS.forEach(id=>planner.fields[id]=activeArmor[id]);\n    const activeUtility=planner.utilityLoadouts[String(planner.utilityLoadoutActive)];\n    UTILITY_FIELDS.forEach(id=>planner.fields[id]=activeUtility[id]);planner.fields.utilityLoadoutNote=activeUtility.note||'';\n    delete planner.targetLevel;\n    return planner;\n  }\n\n  function exportPlannerBuildFixed(){\n    const planner=cloneValue(syncPlannerBeforeExport());\n    const level=typeof calcCurrentLevel==='function'?calcCurrentLevel():Number(planner.ownedLevel)||0;\n    const className=planner.className||'Vagabond';\n    const payload={schema:'elden-ring-companion-build',formatVersion:1,schemaVersion:1,structureVersion:2,appVersion:'1.5.5b',exportedAt:new Date().toISOString(),name:`${className} Lv.${level}`,planner};\n    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');\n    const date=new Date().toISOString().slice(0,10),safe=typeof safeBuildFilePart==='function'?safeBuildFilePart(className):String(className).replace(/\\W+/g,'-').toLowerCase();\n    a.href=URL.createObjectURL(blob);a.download=`elden-ring-build-${safe}-lv${level}-${date}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n    try{toast('Đã xuất Build đầy đủ cấu trúc ✓')}catch(e){}\n  }\n\n  async function importPlannerBuildFixed(file){\n    if(!file)return;\n    let parsed,planner;\n    try{\n      parsed=JSON.parse(await file.text());\n      const format=Number(parsed?.formatVersion??parsed?.schemaVersion??1);\n      if(!Number.isFinite(format)||format<1||format>2)throw new Error('Phiên bản định dạng build chưa được hỗ trợ.');\n      const candidate=parsed?.schema==='elden-ring-companion-build'?parsed.planner:(parsed?.planner||parsed);\n      planner=normalizeImportedPlanner(candidate);\n    }catch(error){alert(`Không thể nhập build: ${error?.message||'File JSON không hợp lệ.'}`);return}\n    const sourceVersion=parsed?.appVersion||parsed?.version||'không rõ';\n    if(!confirm(`Nhập build từ Version ${sourceVersion}?\\n\\nVũ khí, AoW, 3 loadout vũ khí, 3 loadout giáp, 3 loadout bùa/Crystal Tear và 12 slot phép sẽ được giữ nguyên cấu trúc.`))return;\n    state.planner=planner;\n    try{if(typeof ensureWeaponLoadouts==='function')ensureWeaponLoadouts()}catch(e){}\n    try{if(typeof ensureArmorLoadouts==='function')ensureArmorLoadouts()}catch(e){}\n    try{if(typeof ensureUtilityLoadouts==='function')ensureUtilityLoadouts()}catch(e){}\n    saveState();\n    try{\n      if(typeof refreshPlannerBuildUiFromState==='function')await refreshPlannerBuildUiFromState();\n      else {initPlanner();renderPlanner()}\n    }catch(error){\n      console.warn('[Build Import] Dữ liệu đã lưu, renderer cảnh báo:',error);\n      try{initPlanner();renderPlanner()}catch(e){}\n    }\n    saveState();\n    try{toast('Đã nhập Build đầy đủ cấu trúc ✓')}catch(e){}\n  }\n\n  function bindBuildTransfer(){\n    const exportBtn=byId('exportBuildBtn'),importBtn=byId('importBuildBtn'),fileInput=byId('buildImportFile');\n    if(!exportBtn||!importBtn||!fileInput)return false;\n    if(exportBtn.dataset.structureFix==='3'&&importBtn.dataset.structureFix==='3')return true;\n    exportBtn.onclick=event=>{event.preventDefault();exportPlannerBuildFixed()};\n    importBtn.onclick=event=>{event.preventDefault();fileInput.click()};\n    fileInput.onchange=async()=>{const file=fileInput.files?.[0];try{await importPlannerBuildFixed(file)}finally{fileInput.value=''}};\n    exportBtn.dataset.structureFix='3';importBtn.dataset.structureFix='3';\n    return true;\n  }\n\n  const RELEASED_CLASSES=['Heavy Knight','Idus Knight'];\n  function fixReleasedClasses(){\n    try{\n      if(typeof CLASSES!=='undefined'){\n        RELEASED_CLASSES.forEach(name=>{if(CLASSES[name])CLASSES[name].upcoming=false});\n      }\n    }catch(e){console.warn('[Released Classes] CLASSES:',e)}\n    try{\n      if(typeof UPCOMING_CLASSES!=='undefined'){\n        RELEASED_CLASSES.forEach(name=>{try{delete UPCOMING_CLASSES[name]}catch(e){}});\n      }\n    }catch(e){}\n\n    const select=byId('classSelect');\n    if(select){\n      Array.from(select.options||[]).forEach(option=>{\n        if(RELEASED_CLASSES.includes(option.value))option.textContent=option.value;\n      });\n    }\n    const badge=byId('classBadge');\n    if(badge&&select&&RELEASED_CLASSES.includes(select.value))badge.textContent=select.value;\n\n    document.querySelectorAll('.upcoming-class-chip').forEach(chip=>{\n      const name=chip.querySelector('strong')?.textContent?.trim();\n      if(RELEASED_CLASSES.includes(name))chip.remove();\n    });\n    document.querySelectorAll('.upcoming-class-list').forEach(list=>{\n      if(!list.querySelector('.upcoming-class-chip'))list.remove();\n    });\n    return !!select;\n  }\n\n  function updateVersion(){\n    const normalize=text=>String(text||'').replace(/1\\.4\\.5(?:\\.[a-z])?|1\\.5(?:\\.\\d+)*(?:[a-z])?/gi,'1.5.5b');\n    document.title=normalize(document.title);\n    document.querySelectorAll('.brand-title small,.version-label,.app-version').forEach(el=>{el.textContent=normalize(el.textContent)});\n  }\n\n  function boot(){\n    let damageReady=false,transferReady=false,releasedReady=false,tries=0;\n    const attempt=()=>{\n      tries++;\n      damageReady=bindDamageButton()||damageReady;\n      transferReady=bindBuildTransfer()||transferReady;\n      releasedReady=fixReleasedClasses()||releasedReady;\n      updateVersion();\n      return damageReady&&transferReady&&releasedReady;\n    };\n    if(attempt())return;\n    const timer=setInterval(()=>{if(attempt()||tries>=40)clearInterval(timer)},250);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n";
  const status=document.getElementById('status');
  const errorWrap=document.getElementById('errorWrap');
  const errorBox=document.getElementById('error');

  function sanitizeLoaderStatus(source){
    let cleaned=String(source||'');
    // Xóa mọi thông báo kỹ thuật của loader, kể cả bản lỗi mã hóa.
    cleaned=cleaned.replace(
      /status\.textContent\s*=\s*['"][^;\n]*(?:bản\s*nền|gắn\s*nút\s*Tính\s*sát\s*thương|Da\s*tai\s*ban\s*nen|Dang\s*gan\s*nut)[^;\n]*['"]\s*;?/gi,
      "status.textContent='Vui l\u00f2ng ch\u1edd...';"
    );
    cleaned=cleaned
      .replace("status.textContent='Đã tải bản nền. Đang gắn nút Tính sát thương…';","status.textContent='Vui l\u00f2ng ch\u1edd...';")
      .replace("status.textContent='Đã tải bản nền. Đang gắn nút Tính sát thương...';","status.textContent='Vui l\u00f2ng ch\u1edd...';");
    // Bắt mọi bridge cũ mở thẳng calculator 1.5.5b, kể cả khi runtime patch phía dưới không chạy.
    cleaned=cleaned.replace(/\.\/damage-calculator(?:-v1\.5\.5b)?\.html(?:\?v=1\.5\.5b)*/g,'./damage-calculator.html?v=1.5.5b');
    return cleaned;
  }

  function mergeRuntimeFix(source){
    source=sanitizeLoaderStatus(source);
    const pattern=/const damageBridgeCode=("(?:\\.|[^"\\])*");/;
    const match=source.match(pattern);
    if(!match)throw new Error('Không tìm thấy Damage Bridge trong bản trang chính đã khóa.');
    let baseCode;
    try{baseCode=JSON.parse(match[1])}catch(error){throw new Error('Không đọc được Damage Bridge gốc: '+error.message)}
    // Sửa ngay bridge gốc: dù người dùng bấm trước khi FIX_CODE bind xong, vẫn chỉ mở calculator mới.
    baseCode=baseCode.replace(/\.\/damage-calculator(?:-v1\.5\.5b)?\.html(?:\?v=1\.5\.5b)*/g,'./damage-calculator.html?v=1.5.5b');
    baseCode=baseCode.replace(/\u231b?\s*\u0110ang l\u1ea5y Build(?:\u2026|\.\.\.)/g,'Đang chuẩn bị dữ liệu...');
    if(!baseCode.includes('__ER_COMPANION_V155B_FIX__'))baseCode+='\n'+FIX_CODE;
    const replacement='const damageBridgeCode='+JSON.stringify(baseCode)+';';
    const patched=source.replace(match[0],replacement);
    if(patched===source)throw new Error('Không thể gắn bản sửa 1.5.5b vào trang chính.');
    return patched;
  }

  try{
    const response=await fetch(LINKED_MAIN,{cache:'no-cache'});
    if(!response.ok)throw new Error('Không tải được trang chính đã khóa: HTTP '+response.status);
    const source=await response.text();
    let html;
    try{
      html=mergeRuntimeFix(source);
      status.textContent='Vui l\u00f2ng ch\u1edd...';
    }catch(patchError){
      console.error('[ER 1.5.5b patch]',patchError);
      // Ưu tiên cho trang chính vẫn mở được thay vì đứng ở màn hình lỗi.
      html=sanitizeLoaderStatus(source);
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.style.display='none';
    errorBox.textContent=String(err&&err.stack||err)+'\n\nHãy kiểm tra kết nối mạng rồi tải lại trang.';
    errorWrap.style.display='grid';
  }
})();
