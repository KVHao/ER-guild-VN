<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10120f">
<title>Elden Ring Companion 1.5.1</title>
<style>
html,body{margin:0;min-height:100%;background:#0d100d;color:#e7e4d4;font-family:Georgia,serif}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#cdbf86;font-size:13px;line-height:1.6;letter-spacing:.03em}
#errorWrap{display:none;min-height:100vh;place-items:center;padding:24px}
#errorBox{width:min(760px,calc(100% - 32px));border:1px solid rgba(225,211,151,.48);background:#151914;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
#errorBox h1{margin:0 0 10px;font-size:22px;color:#eadca6}
#errorBox pre{white-space:pre-wrap;color:#d6a69b;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
</style>
</head>
<body>
<div id="status">Đang mở Elden Ring Companion và liên kết Damage Calculator…</div>
<div id="errorWrap"><div id="errorBox"><h1>Không thể mở Elden Ring Companion</h1><pre id="error"></pre></div></div>
<script>
(async function(){
  'use strict';
  // Bản trang chính đã có bridge gửi Build sang ./damage-calculator.html.
  // Khóa theo commit để khi thay index.html trên GitHub sẽ không tự fetch chính nó.
  const LINKED_MAIN='https://raw.githubusercontent.com/KVHao/ER-guild-VN/24fb29af6893db632cd4f36531a59200d4fadd3d/index.html';
  const status=document.getElementById('status');
  const errorWrap=document.getElementById('errorWrap');
  const errorBox=document.getElementById('error');
  try{
    const response=await fetch(LINKED_MAIN,{cache:'no-cache'});
    if(!response.ok)throw new Error('Không tải được trang chính đã khóa: HTTP '+response.status);
    const html=await response.text();
    if(!html.includes('damage-calculator.html'))throw new Error('Bản trang chính không chứa liên kết Damage Calculator.');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.style.display='none';
    errorBox.textContent=String(err&&err.stack||err);
    errorWrap.style.display='grid';
  }
})();
</script>
</body>
</html>
