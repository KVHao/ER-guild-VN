<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10120f">
<title>Elden Ring Companion 1.5.3</title>
<style>
html,body{margin:0;min-height:100%;background:#0d100d;color:#e7e4d4;font-family:Georgia,serif}
#status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:#cdbf86;font-size:13px;line-height:1.6;letter-spacing:.03em}
#errorWrap{display:none;min-height:100vh;place-items:center;padding:24px}
#errorBox{width:min(760px,calc(100% - 32px));border:1px solid rgba(225,211,151,.48);background:#151914;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
#errorBox h1{margin:0 0 10px;font-size:22px;color:#eadca6}
#errorBox pre{white-space:pre-wrap;color:#d6a69b;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
</style>
</head>
<body>
<div id="status">Đang mở Elden Ring Companion · bản sửa ổn định 1.5.3…</div>
<div id="errorWrap"><div id="errorBox"><h1>Không thể mở Elden Ring Companion</h1><pre id="error"></pre></div></div>
<script>
(async function(){
  'use strict';
  const LINKED_MAIN="https://raw.githubusercontent.com/KVHao/ER-guild-VN/24fb29af6893db632cd4f36531a59200d4fadd3d/index.html";
  const FIX_CODE=";(function(){\n  'use strict';\n  if(window.__ER_COMPANION_V153_FIX__)return;\n  window.__ER_COMPANION_V153_FIX__=true;\n  const PAYLOAD_KEY='kvhao_er_damage_payload_v1';\n  const DAMAGE_PAGE='./damage-calculator.html';\n  const WEAPON_SLOTS=['weaponR1','weaponL1','weaponR2','weaponL2','weaponR3','weaponL3'];\n  const WEAPON_FIELDS=WEAPON_SLOTS.flatMap(slot=>[slot,slot+'Upgrade',slot+'Affinity',slot+'Ash']);\n  const ARMOR_FIELDS=['helm','chestArmor','gauntlets','legs','greatRune'];\n  const UTILITY_FIELDS=['talisman1','talisman2','talisman3','talisman4','talismanAlt1','talismanAlt2','talismanAlt3','talismanAlt4','physick1','physick2','physick3','physick4'];\n  const FREE_FIELDS=[...Array.from({length:12},(_,i)=>'spell'+(i+1)),...Array.from({length:4},(_,i)=>'spirit'+(i+1)),...Array.from({length:6},(_,i)=>'quickItem'+(i+1)),'weaponLoadoutNote','utilityLoadoutNote','buildNotes'];\n\n  const cloneValue=value=>{try{return JSON.parse(JSON.stringify(value))}catch(e){return null}};\n  const clampIndex=value=>Math.max(1,Math.min(3,Number(value)||1));\n  const byId=id=>document.getElementById(id);\n  const unique=list=>[...new Set((list||[]).filter(Boolean).map(String))];\n\n  function iconCandidates(fieldId){\n    const out=[];\n    const holder=document.querySelector(`[data-planner-icon-field=\"${fieldId}\"]`);\n    const img=holder?.querySelector?.('img');\n    if(img?.src)out.push(img.src);\n    try{const list=JSON.parse(decodeURIComponent(img?.dataset?.iconCandidates||''));if(Array.isArray(list))out.push(...list)}catch(e){}\n    try{\n      if(typeof plannerCurrentItem==='function'&&typeof plannerItemIconDescriptor==='function'){\n        const item=plannerCurrentItem(fieldId),desc=item?plannerItemIconDescriptor(fieldId,item):null;\n        if(desc?.candidates)out.push(...desc.candidates);\n        if(desc?.url)out.push(desc.url);\n      }\n    }catch(e){}\n    return unique(out);\n  }\n\n  function enrichDamagePayload(payload){\n    const copy=cloneValue(payload)||payload||{};\n    copy.weapons=(copy.weapons||[]).map(weapon=>{\n      const w={...weapon};\n      const ashField=String(w.slot||'')+'Ash';\n      const images=iconCandidates(ashField);\n      w.ashIcon=images[0]||'';\n      w.ashImageCandidates=images;\n      try{\n        if(typeof plannerCurrentItem==='function'){\n          const item=plannerCurrentItem(ashField);\n          w.ashMeta=item?{name:item.name||'',group:item.group||'',category:item.category||'',id:item.id||''}:null;\n        }\n      }catch(e){}\n      return w;\n    });\n    return copy;\n  }\n\n  async function openDamageFixed(button){\n    const original=button?.innerHTML||'';\n    try{\n      if(button){button.disabled=true;button.innerHTML='⌛ Đang lấy Build…'}\n      if(!window.ERDamageBridge?.capture)throw new Error('Damage Bridge chưa sẵn sàng.');\n      const payload=enrichDamagePayload(await window.ERDamageBridge.capture());\n      localStorage.setItem(PAYLOAD_KEY,JSON.stringify(payload));\n      const target=new URL(DAMAGE_PAGE,location.href);\n      target.searchParams.set('from','planner');target.searchParams.set('t',Date.now());\n      window.open(target.href,'_blank','noopener');\n    }catch(error){\n      console.error('[Damage Bridge Fix]',error);\n      try{if(typeof toast==='function')toast('Không gửi được Build sang Damage Calculator')}catch(e){}\n      alert('Không gửi được Build sang Damage Calculator: '+String(error?.message||error));\n    }finally{if(button){button.disabled=false;button.innerHTML=original}}\n  }\n\n  function bindDamageButton(){\n    const old=byId('plannerDamageLaunchBtn');\n    if(!old)return false;\n    if(old.dataset.v153Bound==='1')return true;\n    const button=old.cloneNode(true);\n    button.dataset.v153Bound='1';\n    old.replaceWith(button);\n    button.addEventListener('click',event=>{event.preventDefault();openDamageFixed(button)});\n    window.ERDamageBridge=window.ERDamageBridge||{};\n    window.ERDamageBridge.open=()=>openDamageFixed(button);\n    return true;\n  }\n\n  function syncPlannerBeforeExport(){\n    try{if(typeof saveActiveWeaponLoadoutFromDom==='function')saveActiveWeaponLoadoutFromDom()}catch(e){console.warn(e)}\n    try{if(typeof saveActiveArmorLoadoutFromDom==='function')saveActiveArmorLoadoutFromDom()}catch(e){console.warn(e)}\n    try{if(typeof saveActiveUtilityLoadoutFromDom==='function')saveActiveUtilityLoadoutFromDom()}catch(e){console.warn(e)}\n    state.planner=state.planner||cloneValue(DEFAULT_STATE.planner)||{};\n    state.planner.fields=state.planner.fields&&typeof state.planner.fields==='object'?state.planner.fields:{};\n    [...WEAPON_FIELDS,...ARMOR_FIELDS,...UTILITY_FIELDS,...FREE_FIELDS].forEach(id=>{\n      const el=byId(id);if(el)state.planner.fields[id]=String(el.value??'');\n    });\n    try{if(typeof ensureWeaponLoadouts==='function')ensureWeaponLoadouts()}catch(e){}\n    try{if(typeof ensureArmorLoadouts==='function')ensureArmorLoadouts()}catch(e){}\n    try{if(typeof ensureUtilityLoadouts==='function')ensureUtilityLoadouts()}catch(e){}\n    return state.planner;\n  }\n\n  function normalizeLoadoutMap(source,fieldIds,defaults={},withNote=false,legacy={}){\n    const map=source&&typeof source==='object'&&!Array.isArray(source)?source:{};\n    const out={};\n    for(let index=1;index<=3;index++){\n      const key=String(index),raw=map[key]||map[index]||(index===1?legacy:{}),entry={};\n      fieldIds.forEach(id=>entry[id]=String(raw?.[id]??defaults[id]??''));\n      if(withNote)entry.note=String(raw?.note??(index===1?legacy.note:'')??'');\n      out[key]=entry;\n    }\n    return out;\n  }\n\n  function normalizeImportedPlanner(raw){\n    if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('Không tìm thấy dữ liệu Planner.');\n    let planner=typeof deepMerge==='function'?deepMerge(DEFAULT_STATE.planner,cloneValue(raw)||raw):(cloneValue(raw)||{});\n    const className=String(planner.className||'');\n    if(typeof CLASSES==='undefined'||!CLASSES[className])throw new Error('Lớp khởi đầu trong file không hợp lệ.');\n    const base=CLASSES[className];\n    planner.stats=planner.stats&&typeof planner.stats==='object'?planner.stats:{};\n    Object.keys(STAT_LABELS).forEach(key=>{\n      const n=Number(planner.stats[key]);\n      if(!Number.isFinite(n))throw new Error(`Chỉ số ${STAT_LABELS[key]} không hợp lệ.`);\n      planner.stats[key]=Math.max(Number(base.stats[key])||1,Math.min(99,Math.round(n)));\n    });\n    const used=Object.keys(base.stats).reduce((sum,key)=>sum+Math.max(0,planner.stats[key]-base.stats[key]),0);\n    planner.ownedLevel=Math.min(713,base.level+used);\n    planner.fields=planner.fields&&typeof planner.fields==='object'&&!Array.isArray(planner.fields)?planner.fields:{};\n\n    const weaponDefaults={};WEAPON_FIELDS.forEach(id=>weaponDefaults[id]=id.endsWith('Affinity')?'Standard':id.endsWith('Upgrade')?'0':'');\n    const weaponLegacy={note:String(planner.fields.weaponLoadoutNote||'')};WEAPON_FIELDS.forEach(id=>weaponLegacy[id]=String(planner.fields[id]??weaponDefaults[id]));\n    const armorLegacy={};ARMOR_FIELDS.forEach(id=>armorLegacy[id]=String(planner.fields[id]||''));\n    const utilityLegacy={note:String(planner.fields.utilityLoadoutNote||'')};UTILITY_FIELDS.forEach(id=>utilityLegacy[id]=String(planner.fields[id]||''));\n\n    planner.weaponLoadouts=normalizeLoadoutMap(raw.weaponLoadouts||planner.weaponLoadouts,WEAPON_FIELDS,weaponDefaults,true,weaponLegacy);\n    planner.armorLoadouts=normalizeLoadoutMap(raw.armorLoadouts||planner.armorLoadouts,ARMOR_FIELDS,{},false,armorLegacy);\n    planner.utilityLoadouts=normalizeLoadoutMap(raw.utilityLoadouts||planner.utilityLoadouts,UTILITY_FIELDS,{},true,utilityLegacy);\n    planner.weaponLoadoutActive=clampIndex(raw.weaponLoadoutActive??planner.weaponLoadoutActive);\n    planner.armorLoadoutActive=clampIndex(raw.armorLoadoutActive??planner.armorLoadoutActive);\n    planner.utilityLoadoutActive=clampIndex(raw.utilityLoadoutActive??planner.utilityLoadoutActive);\n\n    const activeWeapon=planner.weaponLoadouts[String(planner.weaponLoadoutActive)];\n    WEAPON_FIELDS.forEach(id=>planner.fields[id]=activeWeapon[id]);planner.fields.weaponLoadoutNote=activeWeapon.note||'';\n    const activeArmor=planner.armorLoadouts[String(planner.armorLoadoutActive)];\n    ARMOR_FIELDS.forEach(id=>planner.fields[id]=activeArmor[id]);\n    const activeUtility=planner.utilityLoadouts[String(planner.utilityLoadoutActive)];\n    UTILITY_FIELDS.forEach(id=>planner.fields[id]=activeUtility[id]);planner.fields.utilityLoadoutNote=activeUtility.note||'';\n    delete planner.targetLevel;\n    return planner;\n  }\n\n  function exportPlannerBuildFixed(){\n    const planner=cloneValue(syncPlannerBeforeExport());\n    const level=typeof calcCurrentLevel==='function'?calcCurrentLevel():Number(planner.ownedLevel)||0;\n    const className=planner.className||'Vagabond';\n    const payload={schema:'elden-ring-companion-build',formatVersion:1,schemaVersion:1,structureVersion:2,appVersion:'1.5.3',exportedAt:new Date().toISOString(),name:`${className} Lv.${level}`,planner};\n    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');\n    const date=new Date().toISOString().slice(0,10),safe=typeof safeBuildFilePart==='function'?safeBuildFilePart(className):String(className).replace(/\\W+/g,'-').toLowerCase();\n    a.href=URL.createObjectURL(blob);a.download=`elden-ring-build-${safe}-lv${level}-${date}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n    try{toast('Đã xuất Build đầy đủ cấu trúc ✓')}catch(e){}\n  }\n\n  async function importPlannerBuildFixed(file){\n    if(!file)return;\n    let parsed,planner;\n    try{\n      parsed=JSON.parse(await file.text());\n      const format=Number(parsed?.formatVersion??parsed?.schemaVersion??1);\n      if(!Number.isFinite(format)||format<1||format>2)throw new Error('Phiên bản định dạng build chưa được hỗ trợ.');\n      const candidate=parsed?.schema==='elden-ring-companion-build'?parsed.planner:(parsed?.planner||parsed);\n      planner=normalizeImportedPlanner(candidate);\n    }catch(error){alert(`Không thể nhập build: ${error?.message||'File JSON không hợp lệ.'}`);return}\n    const sourceVersion=parsed?.appVersion||parsed?.version||'không rõ';\n    if(!confirm(`Nhập build từ Version ${sourceVersion}?\\n\\nVũ khí, AoW, 3 loadout vũ khí, 3 loadout giáp, 3 loadout bùa/Crystal Tear và 12 slot phép sẽ được giữ nguyên cấu trúc.`))return;\n    state.planner=planner;\n    try{if(typeof ensureWeaponLoadouts==='function')ensureWeaponLoadouts()}catch(e){}\n    try{if(typeof ensureArmorLoadouts==='function')ensureArmorLoadouts()}catch(e){}\n    try{if(typeof ensureUtilityLoadouts==='function')ensureUtilityLoadouts()}catch(e){}\n    saveState();\n    try{\n      if(typeof refreshPlannerBuildUiFromState==='function')await refreshPlannerBuildUiFromState();\n      else {initPlanner();renderPlanner()}\n    }catch(error){\n      console.warn('[Build Import] Dữ liệu đã lưu, renderer cảnh báo:',error);\n      try{initPlanner();renderPlanner()}catch(e){}\n    }\n    saveState();\n    try{toast('Đã nhập Build đầy đủ cấu trúc ✓')}catch(e){}\n  }\n\n  function bindBuildTransfer(){\n    const exportBtn=byId('exportBuildBtn'),importBtn=byId('importBuildBtn'),fileInput=byId('buildImportFile');\n    if(!exportBtn||!importBtn||!fileInput)return false;\n    if(exportBtn.dataset.structureFix==='3'&&importBtn.dataset.structureFix==='3')return true;\n    exportBtn.onclick=event=>{event.preventDefault();exportPlannerBuildFixed()};\n    importBtn.onclick=event=>{event.preventDefault();fileInput.click()};\n    fileInput.onchange=async()=>{const file=fileInput.files?.[0];try{await importPlannerBuildFixed(file)}finally{fileInput.value=''}};\n    exportBtn.dataset.structureFix='3';importBtn.dataset.structureFix='3';\n    return true;\n  }\n\n  function updateVersion(){\n    const normalize=text=>String(text||'').replace(/1\\.4\\.5(?:\\.[a-z])?|1\\.5(?:\\.\\d+)*/gi,'1.5.3');\n    document.title=normalize(document.title);\n    document.querySelectorAll('.brand-title small,.version-label,.app-version').forEach(el=>{el.textContent=normalize(el.textContent)});\n  }\n\n  function boot(){\n    let damageReady=false,transferReady=false,tries=0;\n    const attempt=()=>{\n      tries++;\n      damageReady=bindDamageButton()||damageReady;\n      transferReady=bindBuildTransfer()||transferReady;\n      updateVersion();\n      return damageReady&&transferReady;\n    };\n    if(attempt())return;\n    const timer=setInterval(()=>{if(attempt()||tries>=40)clearInterval(timer)},250);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n";
  const status=document.getElementById('status');
  const errorWrap=document.getElementById('errorWrap');
  const errorBox=document.getElementById('error');

  function mergeRuntimeFix(source){
    const pattern=/const damageBridgeCode=("(?:\\.|[^"\\])*");/;
    const match=source.match(pattern);
    if(!match)throw new Error('Không tìm thấy Damage Bridge trong bản trang chính đã khóa.');
    let baseCode;
    try{baseCode=JSON.parse(match[1])}catch(error){throw new Error('Không đọc được Damage Bridge gốc: '+error.message)}
    if(!baseCode.includes('__ER_COMPANION_V153_FIX__'))baseCode+='\n'+FIX_CODE;
    const replacement='const damageBridgeCode='+JSON.stringify(baseCode)+';';
    const patched=source.replace(match[0],replacement);
    if(patched===source)throw new Error('Không thể gắn bản sửa 1.5.3 vào trang chính.');
    return patched;
  }

  try{
    const response=await fetch(LINKED_MAIN,{cache:'no-cache'});
    if(!response.ok)throw new Error('Không tải được trang chính đã khóa: HTTP '+response.status);
    const source=await response.text();
    let html;
    try{
      html=mergeRuntimeFix(source);
      status.textContent='Đã tải trang chính · đang khởi tạo Planner và Damage Calculator…';
    }catch(patchError){
      console.error('[ER 1.5.3 patch]',patchError);
      // Ưu tiên cho trang chính vẫn mở được thay vì đứng ở màn hình lỗi.
      html=source;
    }
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.style.display='none';
    errorBox.textContent=String(err&&err.stack||err)+'\n\nHãy kiểm tra kết nối mạng rồi tải lại trang.';
    errorWrap.style.display='grid';
  }
})();
</script>
</body>
</html>
