tem&&typeof findPlanerItem==='function')item=findPlanerItem(input.value)}catch(e){}\n        if(!item){try{toast('Tên chưa khớp kho vật phẩm')}catch(e){};return}\n        try{openItemDetail(item.id)}catch(e){}\n      });\n    });\n  }\n\n\n  function makeDamageSnapshot(){\n    let planner={};\n    try{planner=JSON.parse(JSON.stringify((typeof state!=='undefined'&&state&&state.planner)||{}))}catch(e){planner={}}\n    return{schema:'ER_DAMAGE_SNAPSHOT_145C',version:VERSION,createdAt:Date.now(),planner};\n  }\n\n  function openDamageCalculator(){\n    const snapshot=makeDamageSnapshot();\n    try{localStorage.setItem('ER_DAMAGE_SNAPSHOT_145C',JSON.stringify(snapshot))}catch(e){}\n    let child=null;\n    try{child=window.open(new URL('damage-calculator.html',window.location.href).href,'_blank')}catch(e){child=window.open('damage-calculator.html','_blank')}\n    if(!child){try{toast('Trình duyệt đang chặn cửa sổ mới. Hãy cho phép pop-up rồi bấm lại.')}catch(e){alert('Trình duyệt đang chặn cửa sổ mới. Hãy cho phép pop-up rồi bấm lại.')}return}\n    const send=()=>{try{child.postMessage({type:'ER_DAMAGE_SNAPSHOT_145C',snapshot},'*')}catch(e){}};\n    const ready=ev=>{if(ev.source===child&&ev.data&&ev.data.type==='ER_DAMAGE_READY_145C'){send();window.removeEventListener('message',ready)}};\n    window.addEventListener('message',ready);\n    setTimeout(send,250);setTimeout(send,900);\n  }\n\n  function createOutputDamageSection(){\n    if(q('outputDamageAsideSection'))return q('outputDamageAsideSection');\n    const statList=q('statList'),armor=q('armorAsideSection');if(!statList||!armor)return null;\n    const sec=document.createElement('div');sec.className='aside-section';sec.id='outputDamageAsideSection';\n    sec.innerHTML=`<div class=\"aside-section-hdr\"><h4>Chỉ số sát thương đầu ra</h4><span class=\"aside-section-chevron\">▼</span></div><div class=\"aside-section-body\"><div class=\"output-damage-launch\"><p class=\"output-damage-launch-copy\">Không tính tự động trên Planner. Bấm nút bên dưới để gửi build hiện tại sang trang Damage Calculator riêng.</p><button class=\"output-damage-launch-btn\" id=\"openDamageCalculatorBtn\" type=\"button\"><span>⚔</span><span>Tính sát thương</span><span>↗</span></button><div class=\"output-damage-launch-note\">Trang chính không tải engine AR/Spell Damage.</div></div></div>`;\n    armor.parentNode.insertBefore(sec,armor);\n    sec.querySelector('.aside-section-hdr').addEventListener('click',()=>sec.classList.toggle('closed'));\n    q('openDamageCalculatorBtn')?.addEventListener('click',ev=>{ev.stopPropagation();openDamageCalculator()});\n    return sec;\n  }\n\n  function extractEffectFallback(row){\n    const text=(row.querySelector('.planner-effect-copy p')?.textContent||'').trim();\n    const nums=text.match(/[+-]?\\d+(?:[.,]\\d+)?\\s*(?:%|HP|FP|slot|slots|ô|điểm|\\/s)/gi)||[];\n    return nums.slice(0,6).map(v=>['Hiệu ứng',v,/^-/.test(v.trim())?'neg':'pos']);\n  }\n\n  function compactPlannerEffects(){\n    if(compactingEffects)return;const host=q('plannerActiveEffects');if(!host)return;\n    const sourceRows=[...host.querySelectorAll('.planner-effect-row')];if(!sourceRows.length)return;\n    if(!sourceRows.some(r=>r.querySelector('.planner-effect-copy')))return;\n    compactingEffects=true;\n    try{\n      const rows=sourceRows.map(row=>{\n        const source=row.querySelector('.planner-effect-source'),name=(source?.querySelector('strong')?.textContent||'').trim();let slot=(source?.querySelector('small')?.textContent||'Trang bị').trim();\n        const vals=EFFECT_NUMBERS[norm(name)]||extractEffectFallback(row);if(!vals.length)return'';\n        return effectNumberRow(slot,name,vals);\n      });\n      const p=fields();[['physick1','Crystal Tear 1'],['physick2','Crystal Tear 2']].forEach(([id,slot])=>{const name=String(p[id]||'').trim(),vals=CRYSTAL_TEAR_NUMBERS[norm(name)];if(name&&vals)rows.push(effectNumberRow(slot,name,vals))});\n      host.innerHTML=rows.filter(Boolean).length?`<div class=\"planner-effect-number-table\">${rows.filter(Boolean).join('')}</div>`:'<div class=\"planner-effect-empty\">Chưa có con số hiệu ứng để hiển thị.</div>';\n    }finally{compactingEffects=false}\n  }\n\n  function effectNumberRow(slot,name,vals){\n    const lines=vals.map(v=>`<div class=\"planner-effect-number-line ${v[2]==='neg'?'neg':v[2]==='trigger'?'trigger':''}\">${escHtml(v[0])}${v[1]?` <b>${escHtml(v[1])}</b>`:''}</div>`).join('');\n    return`<div class=\"planner-effect-number-row\"><div class=\"planner-effect-number-slot\">${escHtml(slot)}</div><div class=\"planner-effect-number-name\">${escHtml(name)}</div><div class=\"planner-effect-number-values\">${lines}</div></div>`;\n  }\n\n  function watchEffects(attempt=0){\n    const host=q('plannerActiveEffects');if(!host){if(attempt<16)setTimeout(()=>watchEffects(attempt+1),350);return}\n    if(!host.dataset.compactEffectsBound){host.dataset.compactEffectsBound='1';new MutationObserver(()=>queueMicrotask(compactPlannerEffects)).observe(host,{childList:true,subtree:true})}\n    compactPlannerEffects();\n  }\n\n  function applySmallSourcePatches(){\n    // Footer/version badges generated by source may still carry old text after dynamic render.\n    document.querySelectorAll('.build-tools-panel .badge').forEach(x=>{if(/version/i.test(x.textContent||''))x.textContent='Version '+VERSION});\n  }\n\n\n  function ensurePatchedUI(attempt=0){\n    clearTimeout(uiPatchRetryTimer);\n    initBuildNativeStats();initArmorLoadouts();initEffectButtons();createOutputDamageSection();applySmallSourcePatches();\n    if(q('statList')&&q('plannerActiveEffects')){watchEffects();return}\n    if(attempt<16)uiPatchRetryTimer=setTimeout(()=>ensurePatchedUI(attempt+1),300);\n  }\n\n  function boot(){ensurePatchedUI()}\n\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(boot,0),{once:true});else setTimeout(boot,0);\n})();\n";
  const status=document.getElementById('bootStatus');
  function patch(html){
    html=html.replace("const APP_VERSION='1.3.2';","const APP_VERSION='1.4.5.c';");
    html=html.replace(/Version\s+1\.3\.2/g,'Version 1.4.5.c').replace(/V1\.3\.2/g,'V1.4.5.c');
    html=html.replace(/Elden Ring Companion\s+1\.3\.2/g,'Elden Ring Companion 1.4.5.c');
    html=html.replace("quickItems=all.filter(item=>item.group==='Items'&&item.category!=='Crystal Tears')","quickItems=all.filter(item=>item.group==='Items'&&item.category==='Consumable Items')");
    html=html.replace('<h2>Giáp &amp; Trang bị nhân vật</h2>','<h2>Giáp và Great Rune</h2>');
    html=html.replace('</head>','<style>'+PATCH_CSS+'</style></head>');
    html=html.replace('</body>','<scr'+'ipt>'+PATCH_RUNTIME+'</scr'+'ipt></body>');
    return html;
  }
  try{
    status.textContent='Đang tải dữ liệu ứng dụng…';
    const res=await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const raw=await res.text();
    if(!raw.includes("const APP_VERSION='1.3.2';")&&!raw.includes('tab-planner'))throw new Error('Nguồn ứng dụng không đúng cấu trúc mong đợi.');
    status.textContent='Đang áp dụng bản 1.4.5.c…';
    const html=patch(raw);
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    status.textContent='Không thể tải nguồn ứng dụng: '+(error&&error.message?error.message:error);
    const p=document.createElement('p');p.textContent='File cần kết nối mạng để tải phần lõi ứng dụng từ GitHub. Hãy kiểm tra mạng rồi mở lại file.';status.parentNode.appendChild(p);
  }
})();
